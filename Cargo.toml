[workspace]
resolver = "3"
members = [".", "crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
readme = "README.md"
documentation = "https://aacebo.github.io/ayr"
homepage = "https://aacebo.github.io/ayr"
repository = "https://www.github.com/aacebo/ayr"

[workspace.lints.clippy]
type_complexity = "allow"

[workspace.dependencies]
crossbeam = { version = "0.8" }
serde = { version = "1" }

[package]
name = "ayr"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
default = ["derive"]
derive = ["ayr-derive"]
reflect = ["ayr-reflect", "ayr-reflect/macros", "ayr-reflect/serde"]

[dependencies]
ayr-core.path = "./crates/core"
ayr-diagnostic.path = "./crates/diagnostic"
ayr-task.path = "./crates/task"
ayr-time.path = "./crates/time"
ayr-state.path = "./crates/state"
ayr-storage.path = "./crates/storage"
ayr-reflect = { path = "./crates/reflect", optional = true }
ayr-derive = { path = "./crates/derive", optional = true }
